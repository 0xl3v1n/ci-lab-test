name: Tunnel v6 Cloudflared

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:

      - name: Install
        run: |
          sudo apt-get install -y openssh-server socat 2>/dev/null | tail -3
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared --max-time 60
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version && echo CLOUDFLARED_OK

      - name: SSH Server
        run: |
          sudo mkdir -p /etc/ssh /run/sshd
          sudo ssh-keygen -A -q 2>/dev/null
          printf 'Port 22\nPermitRootLogin yes\nPubkeyAuthentication yes\nAuthorizedKeysFile %%h/.ssh/authorized_keys\nPasswordAuthentication yes\nGatewayPorts yes\nAllowTcpForwarding yes\nSubsystem sftp /usr/lib/openssh/sftp-server\n' | sudo tee /etc/ssh/sshd_config >/dev/null
          sudo mkdir -p /root/.ssh /home/runner/.ssh
          echo 'ssh-rsa  sysadmin@sysadmin' | sudo tee /root/.ssh/authorized_keys
          echo 'ssh-rsa  sysadmin@sysadmin' | sudo tee /home/runner/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh /home/runner/.ssh
          sudo chmod 600 /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys
          echo 'runner:Pwn2Own2026!' | sudo chpasswd
          echo 'root:Pwn2Own2026!' | sudo chpasswd
          sudo /usr/sbin/sshd && echo SSH_UP
          sleep 1 && ss -tlnp | grep :22

      - name: VM Info
        run: |
          echo HOSTNAME=$(hostname)
          echo INTERNAL=$(hostname -I | awk '{print $1}')
          echo PUBLIC=$(curl -sf https://api.ipify.org 2>/dev/null)
          curl -sf -H Metadata:true 'http://169.254.169.254/metadata/loadbalancer?api-version=2020-10-01' 2>/dev/null
          curl -sf -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' 2>/dev/null | python3 -c "import sys,json; c=json.load(sys.stdin)['compute']; n=json.load(open('/dev/stdin')) if False else None; print('vmId='+c['vmId']); print('sub='+c['subscriptionId']); print('loc='+c['location'])" 2>/dev/null || true

      - name: Cloudflare SSH Tunnel
        run: |
          echo === cloudflared quick tunnel for SSH ===
          cloudflared tunnel --url tcp://localhost:22 --no-autoupdate > /tmp/cf_ssh.log 2>&1 &
          CF_PID=$!
          echo CF_PID=$CF_PID
          sleep 25
          echo === CF LOG ===
          cat /tmp/cf_ssh.log
          CF_URL=$(grep -oP 'https://[^\s]+\.trycloudflare\.com' /tmp/cf_ssh.log | head -1)
          echo CF_SSH_URL=$CF_URL
          kill -0 $CF_PID 2>/dev/null && echo CF_ALIVE || echo CF_DEAD

      - name: Cloudflare RDP Tunnel
        run: |
          cloudflared tunnel --url tcp://localhost:3389 --no-autoupdate > /tmp/cf_rdp.log 2>&1 &
          sleep 20
          cat /tmp/cf_rdp.log
          CF_RDP=$(grep -oP 'https://[^\s]+\.trycloudflare\.com' /tmp/cf_rdp.log | head -1)
          echo CF_RDP_URL=$CF_RDP

      - name: Print Connection Info
        run: |
          CF_SSH=$(grep -oP 'https://[^\s]+\.trycloudflare\.com' /tmp/cf_ssh.log | head -1)
          CF_RDP=$(grep -oP 'https://[^\s]+\.trycloudflare\.com' /tmp/cf_rdp.log | head -1)
          PUB=$(curl -sf https://api.ipify.org 2>/dev/null)
          INT=$(hostname -I | awk '{print $1}')
          echo '=============================='
          echo CF_SSH_URL=$CF_SSH
          echo CF_RDP_URL=$CF_RDP
          echo PUBLIC_IP=$PUB
          echo INTERNAL_IP=$INT
          echo PASSWORD=Pwn2Own2026!
          echo '=============================='
          echo 'How to connect:'
          echo "  cloudflared access tcp --hostname $CF_SSH --url localhost:2222"
          echo '  ssh -p 2222 runner@localhost'
          echo "  ssh runner@$PUB  (direct if port open)"
          echo '=============================='
          for i in $(seq 1 350); do
            sleep 60
            echo beat=$i CF=$CF_SSH
          done
